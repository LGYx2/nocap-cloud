name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nocap Cloud version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Server OS and architecture
      placeholder: Ubuntu 24.04, amd64
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs nocap`. Remove secrets before pasting.
      render: shell
