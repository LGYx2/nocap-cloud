name: Idea
description: Suggest something Nocap Cloud should build. Others vote with a 👍.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are listed on https://nocapcloud.click/community#ideas, sorted by 👍 votes.
        Search first: if the idea exists, vote on it instead of opening a new one.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How could Nocap Cloud solve it? Keep it short; details can come later.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Deploy
        - Git
        - Domains and HTTPS
        - Databases and backups
        - Monitoring
        - Panel
        - Servers
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Can you help build it?
      options:
        - label: I would like to work on this
