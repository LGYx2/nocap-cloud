version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line (22). Odd versions like 25 are short-lived; move to the next
      # LTS on purpose, not through an automatic bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
